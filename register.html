<!doctype html>
<html lang="id"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Daftar — Tiketin</title><link rel="stylesheet" href="style.css" /><script src="store.js" defer></script><script src="forms.js" defer></script></head>
<body><header class="site-header"><nav class="navbar container" aria-label="Navigasi utama"><a class="wordmark" href="index.html#home">Tiketin</a><div class="nav-links"><a class="nav-link" href="index.html#home">Home</a><a class="nav-link" href="login.html">Login</a></div></nav></header>
<main class="login-main container"><section class="login-card" aria-labelledby="registerTitle"><p class="eyebrow">Akun baru</p><h1 id="registerTitle">Daftar ke Tiketin.</h1><p class="login-description">Mulai sebagai user biasa. Kamu bisa mengajukan diri jadi organizer nanti.</p>
<form id="registerForm"><div class="login-field"><label for="fullName">Nama lengkap</label><input id="fullName" name="fullName" autocomplete="name" required /></div><div class="login-field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" required /></div><div class="login-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required /></div><p class="form-error" id="registerError" role="alert"></p><button class="button button-submit" type="submit">Buat akun →</button></form><a class="login-back" href="login.html">Sudah punya akun? Login</a></section></main>
<footer class="site-footer"><div class="container"><p>© 2026 Tiketin. Buat momenmu jadi lebih dekat.</p></div></footer></body></html>
