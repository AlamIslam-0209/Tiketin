<!doctype html>
<html lang="id"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Ajukan organizer — Tiketin</title><link rel="stylesheet" href="style.css" /><script src="store.js" defer></script><script src="common.js" defer></script><script src="forms.js" defer></script></head>
<body><header class="site-header"><nav class="navbar container" aria-label="Navigasi utama"><a class="wordmark" href="index.html#home">Tiketin</a><div class="nav-links"><a class="nav-link" href="index.html#home">Home</a><a class="nav-link" href="index.html#tickets">Ticket</a><div class="account-slot" id="accountSlot"></div></div></nav></header>
<main class="page-main container"><div class="page-heading"><p class="eyebrow">Langkah berikutnya</p><h1>Ajukan jadi organizer.</h1><p>Kirim profil dan event pertamamu. Admin akan meninjau satu kali; setelah disetujui, kamu bebas menambah event sendiri.</p></div>
<div class="notice" id="applicationNotice" hidden></div>
<form class="panel form-panel" id="applicationForm"><h2>Identitas & organisasi</h2><div class="form-grid"><div><label for="fullName">Nama lengkap</label><input id="fullName" name="fullName" required /></div><div><label for="contact">Kontak (email atau nomor telepon)</label><input id="contact" name="contact" required /></div><div class="full-span"><label for="organization">Nama organisasi</label><input id="organization" name="organization" required /></div></div>
<h2>Event pertama</h2><div class="form-grid"><div class="full-span"><label for="name">Nama event</label><input id="name" name="name" required /></div><div><label for="date">Tanggal</label><input id="date" name="date" type="date" required /></div><div><label for="price">Harga tiket (Rp)</label><input id="price" name="price" type="number" min="0" step="1" required /></div><div><label for="slots">Jumlah slot tiket</label><input id="slots" name="slots" type="number" min="1" step="1" required /></div><div><label for="category">Kategori</label><select id="category" name="category"><option>Konser</option><option>Wisata</option><option>Seminar</option><option>Lainnya</option></select></div><div class="full-span"><label for="description">Deskripsi singkat</label><textarea id="description" name="description" rows="3" required></textarea></div></div>
<p class="form-error" id="applicationError" role="alert"></p><button class="button button-primary" type="submit">Kirim pengajuan →</button></form></main>
<footer class="site-footer"><div class="container"><p>© 2026 Tiketin. Buat momenmu jadi lebih dekat.</p></div></footer></body></html>
